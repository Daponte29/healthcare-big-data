name: pyspark_predictive_modeling_2_prod

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/pyspark_predictive_modeling_2_prod.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the prod Terraform stack"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: infra/terraform
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: terraform-plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform fmt
        run: terraform -chdir=${TF_WORKING_DIR} fmt -check -recursive

      - name: Terraform init
        run: >-
          terraform -chdir=${TF_WORKING_DIR} init
          -input=false
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ secrets.TF_STATE_KEY }}"

      - name: Terraform validate
        run: terraform -chdir=${TF_WORKING_DIR} validate

      - name: Terraform plan
        run: terraform -chdir=${TF_WORKING_DIR} plan -out=tfplan

  apply:
    name: terraform-apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: >-
          terraform -chdir=${TF_WORKING_DIR} init
          -input=false
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ secrets.TF_STATE_KEY }}"

      - name: Terraform apply
        run: terraform -chdir=${TF_WORKING_DIR} apply -auto-approve